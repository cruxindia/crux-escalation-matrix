<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux Escalation Matrix</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #666;
    --line: #e4e4e4;
    --bg: #fafafa;
    --card: #ffffff;
    --accent: #1f6feb;
    --good: #1a7f37;
    --good-bg: #eafaf0;
    --bad: #cf222e;
    --bad-bg: #fdecec;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; background: var(--bg); color: var(--ink);
  }

  /* ---- Login screen ---- */
  #loginScreen { max-width: 420px; margin: 90px auto; padding: 0 16px; text-align: center; }
  #loginScreen h1 { font-size: 1.4rem; margin-bottom: 4px; }
  #loginScreen .sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 28px; }
  #loginError { text-align: left; margin-top: 20px; padding: 14px; border-radius: var(--radius); background: var(--bad-bg); border: 1px solid #f3b8b8; color: var(--bad); font-size: 0.88rem; display: none; }

  /* ---- App shell ---- */
  #app { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
  header.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  header.topbar h1 { font-size: 1.2rem; margin: 0; }
  header.topbar .who { font-size: 0.85rem; color: var(--muted); }
  header.topbar .who b { color: var(--ink); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .toolbar h2 { font-size: 1rem; margin: 0; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 0.9rem; cursor: pointer;
  }
  button.primary:hover { background: #185fc9; }
  button.ghost {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; font-size: 0.85rem; cursor: pointer; color: var(--ink);
  }

  /* ---- Client cards ---- */
  .clientCard {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .clientCard:hover { border-color: var(--accent); }
  .clientCard .name { font-weight: 600; font-size: 0.98rem; }
  .clientCard .meta { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .badge.complete { background: var(--good-bg); color: var(--good); }
  .badge.incomplete { background: var(--bad-bg); color: var(--bad); }

  /* ---- Modal ---- */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: var(--radius); padding: 24px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; }
  .field { margin-bottom: 14px; text-align: left; }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 0.92rem; font-family: inherit;
  }
  .modalActions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .formError { color: var(--bad); font-size: 0.85rem; margin-top: 10px; display: none; }

  /* ---- Detail view ---- */
  #detailView { display: none; }
  .backLink { display: inline-block; margin-bottom: 16px; color: var(--accent); cursor: pointer; font-size: 0.88rem; }
  .sectionCard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  .sectionCard h3 { margin: 0 0 12px; font-size: 0.95rem; }
  table.branchTable { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.branchTable th { text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.branchTable td { padding: 8px; border-bottom: 1px solid #f0f0f0; }
  .empty { color: var(--muted); font-size: 0.88rem; padding: 8px 0; }

  .matrixLevels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .matrixLevels { grid-template-columns: 1fr; } }
  .matrixLevel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; }
  .matrixLevel .lvl { font-weight: 600; margin-bottom: 4px; }
  .matrixLevel .missing { color: var(--bad); }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="loginScreen">
  <h1>Crux Escalation Matrix</h1>
  <div class="sub">Sign in with your cruxindia.co.in Google account</div>
  <div id="g_id_onload"
       data-client_id="512625006659-2akqlqt7dogflaqseig316ung5ub08n6.apps.googleusercontent.com"
       data-callback="handleCredentialResponse"
       data-hd="cruxindia.co.in">
  </div>
  <div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large" data-text="signin_with"></div>
  <div id="loginError"></div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header class="topbar">
    <h1>Crux Escalation Matrix</h1>
    <div class="who">Signed in as <b id="whoName"></b> &middot; <span id="whoRole"></span></div>
  </header>

  <div id="navTabs" style="display:flex; gap:8px; margin-bottom:20px;">
    <button class="ghost" id="navClients" style="border-color:var(--accent); color:var(--accent);">Clients</button>
    <button class="ghost" id="navUsers" style="display:none;">Users</button>
  </div>

  <!-- Client list -->
  <div id="listView">
    <div class="toolbar">
      <h2>Clients</h2>
      <button class="primary" id="addClientBtn">+ Add Client</button>
    </div>
    <div id="clientList"></div>
  </div>

  <!-- Users (Admin only) -->
  <div id="usersView" style="display:none;">
    <div class="toolbar">
      <h2>Users</h2>
      <button class="primary" id="addUserBtn">+ Add User</button>
    </div>
    <div id="userList"></div>
  </div>

  <!-- Client detail -->
  <div id="detailView">
    <span class="backLink" id="backToList">&larr; Back to clients</span>

    <div class="sectionCard">
      <h3 id="detailName"></h3>
      <div id="detailMeta" class="empty"></div>
    </div>

    <div class="sectionCard">
      <div class="toolbar" style="margin-bottom:12px;">
        <h3 style="margin:0;">Branches</h3>
        <button class="ghost" id="addBranchBtn">+ Add Branch</button>
      </div>
      <div id="branchTableWrap"></div>
    </div>

    <div class="sectionCard">
      <div class="toolbar" style="margin-bottom:12px;">
        <h3 style="margin:0;">Escalation Matrix <span id="matrixBadge"></span></h3>
        <button class="ghost" id="editMatrixBtn">Edit Matrix</button>
      </div>
      <div id="matrixLevels" class="matrixLevels"></div>
    </div>
  </div>
</div>

<!-- ============ ADD CLIENT MODAL ============ -->
<div class="overlay" id="addClientOverlay">
  <div class="modal">
    <h3>Add Client</h3>
    <div class="field"><label>Client Name *</label><input id="f_name" type="text"></div>
    <div class="field"><label>Client Email *</label><input id="f_email" type="email"></div>
    <div class="field"><label>Client Email CC</label><input id="f_cc" type="text"></div>
    <div class="field"><label>Client Code</label><input id="f_code" type="text"></div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="2"></textarea></div>
    <div class="formError" id="addClientError"></div>
    <div class="modalActions">
      <button class="ghost" id="cancelAddClient">Cancel</button>
      <button class="primary" id="saveAddClient">Save</button>
    </div>
  </div>
</div>

<!-- ============ ADD BRANCH MODAL ============ -->
<div class="overlay" id="addBranchOverlay">
  <div class="modal">
    <h3>Add Branch</h3>
    <div class="field"><label>Branch Name *</label><input id="b_name" type="text"></div>
    <div class="field"><label>Branch Code</label><input id="b_code" type="text"></div>
    <div class="field"><label>Location</label><input id="b_location" type="text"></div>
    <div class="field"><label>Zone</label><input id="b_zone" type="text"></div>
    <div class="field"><label>Crux POC Name</label><input id="b_poc_name" type="text"></div>
    <div class="field"><label>Crux POC Mobile</label><input id="b_poc_mobile" type="text"></div>
    <div class="field"><label>Crux POC Email</label><input id="b_poc_email" type="email"></div>
    <div class="field"><label>Branch Manager Name</label><input id="b_bm_name" type="text"></div>
    <div class="field"><label>Branch Manager Mobile</label><input id="b_bm_mobile" type="text"></div>
    <div class="field"><label>Branch Manager Email</label><input id="b_bm_email" type="email"></div>
    <div class="formError" id="addBranchError"></div>
    <div class="modalActions">
      <button class="ghost" id="cancelAddBranch">Cancel</button>
      <button class="primary" id="saveAddBranch">Save</button>
    </div>
  </div>
</div>

<!-- ============ EDIT MATRIX MODAL ============ -->
<div class="overlay" id="editMatrixOverlay">
  <div class="modal" style="max-width:520px;">
    <h3>Escalation Matrix</h3>
    <div id="matrixFormLevels"></div>
    <div class="formError" id="matrixError"></div>
    <div class="modalActions">
      <button class="ghost" id="cancelMatrix">Cancel</button>
      <button class="primary" id="saveMatrix">Save</button>
    </div>
  </div>
</div>

<!-- ============ ADD USER MODAL ============ -->
<div class="overlay" id="addUserOverlay">
  <div class="modal">
    <h3>Add User</h3>
    <div class="field"><label>Email * (must be @cruxindia.co.in)</label><input id="u_email" type="email"></div>
    <div class="field"><label>Name *</label><input id="u_name" type="text"></div>
    <div class="field"><label>Role *</label>
      <select id="u_role">
        <option value="Location Head">Location Head</option>
        <option value="Admin">Admin</option>
        <option value="Viewer">Viewer</option>
      </select>
    </div>
    <div class="formError" id="addUserError"></div>
    <div class="modalActions">
      <button class="ghost" id="cancelAddUser">Cancel</button>
      <button class="primary" id="saveAddUser">Save</button>
    </div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1acTN1svZ9_i9zBiS_tzn3x8kH7Qs19KeqgSml5MJahT3yQQclmbNVmWxAhULHqOfEw/exec';

let currentToken = null;
let currentUser = null;
let currentClientId = null;

const MATRIX_LEVELS = [
  ['SPOC', 'spoc'], ['Team Leader', 'team_leader'], ['Branch Manager', 'branch_manager'],
  ['Zonal Manager', 'zonal_manager'], ['Head Office', 'head_office']
];

async function api(action, payload) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: currentToken, payload: payload || {} })
  });
  return res.json();
}

async function handleCredentialResponse(response) {
  currentToken = response.credential;
  const data = await api('whoami', {});
  if (!data.ok) {
    const err = document.getElementById('loginError');
    err.style.display = 'block';
    err.textContent = data.error;
    currentToken = null;
    return;
  }
  currentUser = data.user;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoName').textContent = currentUser.name;
  document.getElementById('whoRole').textContent = currentUser.role;
  if (currentUser.role === 'Admin') {
    document.getElementById('navUsers').style.display = 'inline-block';
  }
  loadClients();
}

function showListView() {
  document.getElementById('listView').style.display = 'block';
  document.getElementById('usersView').style.display = 'none';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('navClients').style.borderColor = 'var(--accent)';
  document.getElementById('navClients').style.color = 'var(--accent)';
  document.getElementById('navUsers').style.borderColor = 'var(--line)';
  document.getElementById('navUsers').style.color = 'var(--ink)';
}

function showUsersView() {
  document.getElementById('listView').style.display = 'none';
  document.getElementById('usersView').style.display = 'block';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('navUsers').style.borderColor = 'var(--accent)';
  document.getElementById('navUsers').style.color = 'var(--accent)';
  document.getElementById('navClients').style.borderColor = 'var(--line)';
  document.getElementById('navClients').style.color = 'var(--ink)';
  loadUsers();
}

document.getElementById('navClients').onclick = showListView;
document.getElementById('navUsers').onclick = showUsersView;

async function loadUsers() {
  const listEl = document.getElementById('userList');
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  const data = await api('listUsers', {});
  if (!data.ok) { listEl.innerHTML = '<div class="empty">' + data.error + '</div>'; return; }

  listEl.innerHTML = '';
  data.users.forEach(u => {
    const card = document.createElement('div');
    card.className = 'clientCard';
    card.style.cursor = 'default';
    card.innerHTML =
      '<div>' +
        '<div class="name">' + u.name + '</div>' +
        '<div class="meta">' + u.email + '</div>' +
      '</div>' +
      '<span class="badge complete">' + u.role + '</span>';
    listEl.appendChild(card);
  });
}

document.getElementById('addUserBtn').onclick = () => {
  document.getElementById('addUserOverlay').classList.add('show');
};
document.getElementById('cancelAddUser').onclick = () => {
  document.getElementById('addUserOverlay').classList.remove('show');
};
document.getElementById('saveAddUser').onclick = async () => {
  const errEl = document.getElementById('addUserError');
  errEl.style.display = 'none';

  const payload = {
    email: document.getElementById('u_email').value.trim(),
    name: document.getElementById('u_name').value.trim(),
    role: document.getElementById('u_role').value
  };

  const data = await api('createUser', payload);
  if (!data.ok) {
    errEl.textContent = data.error;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('addUserOverlay').classList.remove('show');
  ['u_email','u_name'].forEach(id => document.getElementById(id).value = '');
  loadUsers();
};

async function loadClients() {
  const listEl = document.getElementById('clientList');
  listEl.innerHTML = '<div class="empty">Loading...</div>';
  const data = await api('listClients', {});
  if (!data.ok) { listEl.innerHTML = '<div class="empty">' + data.error + '</div>'; return; }
  if (data.clients.length === 0) { listEl.innerHTML = '<div class="empty">No clients yet. Add your first client.</div>'; return; }

  listEl.innerHTML = '';
  data.clients.forEach(c => {
    const card = document.createElement('div');
    card.className = 'clientCard';
    card.innerHTML =
      '<div>' +
        '<div class="name">' + c.name + '</div>' +
        '<div class="meta">' + c.branch_count + ' branch' + (c.branch_count === 1 ? '' : 'es') +
        (c.updated_at ? ' &middot; updated ' + new Date(c.updated_at).toLocaleDateString() : '') + '</div>' +
      '</div>' +
      '<span class="badge ' + (c.matrix_complete ? 'complete' : 'incomplete') + '">' +
        (c.matrix_complete ? 'Complete' : 'Incomplete') + '</span>';
    card.onclick = () => openClient(c.client_id);
    listEl.appendChild(card);
  });
}

async function openClient(clientId) {
  const data = await api('getClient', { client_id: clientId });
  if (!data.ok) { alert(data.error); return; }

  currentClientId = clientId;
  window.lastClientData = data;

  document.getElementById('listView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';

  document.getElementById('detailName').textContent = data.client.name;
  document.getElementById('detailMeta').textContent =
    data.client.client_email + (data.client.client_code ? ' \u00b7 ' + data.client.client_code : '');

  const branchWrap = document.getElementById('branchTableWrap');
  if (data.branches.length === 0) {
    branchWrap.innerHTML = '<div class="empty">No branches added yet.</div>';
  } else {
    let rows = data.branches.map(b =>
      '<tr><td>' + b.name + '</td><td>' + (b.code || '') + '</td><td>' + (b.crux_poc_name || '') + '</td><td>' + (b.status || '') + '</td></tr>'
    ).join('');
    branchWrap.innerHTML =
      '<table class="branchTable"><thead><tr><th>Branch</th><th>Code</th><th>Crux POC</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  const badge = document.getElementById('matrixBadge');
  badge.className = 'badge ' + (data.matrix_complete ? 'complete' : 'incomplete');
  badge.textContent = data.matrix_complete ? 'Complete' : 'Incomplete';

  const levels = [
    ['SPOC', 'spoc'], ['Team Leader', 'team_leader'], ['Branch Manager', 'branch_manager'],
    ['Zonal Manager', 'zonal_manager'], ['Head Office', 'head_office']
  ];
  const m = data.matrix || {};
  document.getElementById('matrixLevels').innerHTML = levels.map(([label, key]) => {
    const name = m[key + '_name'], mobile = m[key + '_mobile'], email = m[key + '_email'];
    const filled = name && mobile && email;
    return '<div class="matrixLevel"><div class="lvl">' + label + '</div>' +
      (filled ? (name + '<br>' + mobile + '<br>' + email) : '<span class="missing">Not filled</span>') +
      '</div>';
  }).join('');
}

document.getElementById('backToList').onclick = () => {
  showListView();
};

document.getElementById('addClientBtn').onclick = () => {
  document.getElementById('addClientOverlay').classList.add('show');
};
document.getElementById('cancelAddClient').onclick = () => {
  document.getElementById('addClientOverlay').classList.remove('show');
};
document.getElementById('saveAddClient').onclick = async () => {
  const errEl = document.getElementById('addClientError');
  errEl.style.display = 'none';

  const payload = {
    name: document.getElementById('f_name').value.trim(),
    client_email: document.getElementById('f_email').value.trim(),
    client_cc: document.getElementById('f_cc').value.trim(),
    client_code: document.getElementById('f_code').value.trim(),
    notes: document.getElementById('f_notes').value.trim()
  };

  const data = await api('createClient', payload);
  if (!data.ok) {
    errEl.textContent = data.error;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('addClientOverlay').classList.remove('show');
  ['f_name','f_email','f_cc','f_code','f_notes'].forEach(id => document.getElementById(id).value = '');
  loadClients();
};

/* ---- Add Branch ---- */
document.getElementById('addBranchBtn').onclick = () => {
  document.getElementById('addBranchOverlay').classList.add('show');
};
document.getElementById('cancelAddBranch').onclick = () => {
  document.getElementById('addBranchOverlay').classList.remove('show');
};
document.getElementById('saveAddBranch').onclick = async () => {
  const errEl = document.getElementById('addBranchError');
  errEl.style.display = 'none';

  const payload = {
    client_id: currentClientId,
    name: document.getElementById('b_name').value.trim(),
    code: document.getElementById('b_code').value.trim(),
    location: document.getElementById('b_location').value.trim(),
    zone: document.getElementById('b_zone').value.trim(),
    crux_poc_name: document.getElementById('b_poc_name').value.trim(),
    crux_poc_mobile: document.getElementById('b_poc_mobile').value.trim(),
    crux_poc_email: document.getElementById('b_poc_email').value.trim(),
    branch_manager_name: document.getElementById('b_bm_name').value.trim(),
    branch_manager_mobile: document.getElementById('b_bm_mobile').value.trim(),
    branch_manager_email: document.getElementById('b_bm_email').value.trim()
  };

  const data = await api('createBranch', payload);
  if (!data.ok) {
    errEl.textContent = data.error;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('addBranchOverlay').classList.remove('show');
  ['b_name','b_code','b_location','b_zone','b_poc_name','b_poc_mobile','b_poc_email','b_bm_name','b_bm_mobile','b_bm_email']
    .forEach(id => document.getElementById(id).value = '');
  openClient(currentClientId);
};

/* ---- Edit Matrix ---- */
function renderMatrixForm() {
  const m = (window.lastClientData && window.lastClientData.matrix) || {};
  document.getElementById('matrixFormLevels').innerHTML = MATRIX_LEVELS.map(([label, key]) => {
    return '<div class="field" style="border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px;">' +
      '<label style="font-weight:600; color:var(--ink); margin-bottom:8px;">' + label + '</label>' +
      '<input id="m_' + key + '_name" placeholder="Name" value="' + (m[key + '_name'] || '') + '" style="margin-bottom:6px;">' +
      '<input id="m_' + key + '_mobile" placeholder="Mobile" value="' + (m[key + '_mobile'] || '') + '" style="margin-bottom:6px;">' +
      '<input id="m_' + key + '_email" placeholder="Email" value="' + (m[key + '_email'] || '') + '">' +
      '</div>';
  }).join('');
}

document.getElementById('editMatrixBtn').onclick = () => {
  renderMatrixForm();
  document.getElementById('editMatrixOverlay').classList.add('show');
};
document.getElementById('cancelMatrix').onclick = () => {
  document.getElementById('editMatrixOverlay').classList.remove('show');
};
document.getElementById('saveMatrix').onclick = async () => {
  const errEl = document.getElementById('matrixError');
  errEl.style.display = 'none';

  const payload = { client_id: currentClientId };
  MATRIX_LEVELS.forEach(([label, key]) => {
    payload[key + '_name'] = document.getElementById('m_' + key + '_name').value.trim();
    payload[key + '_mobile'] = document.getElementById('m_' + key + '_mobile').value.trim();
    payload[key + '_email'] = document.getElementById('m_' + key + '_email').value.trim();
  });

  const data = await api('upsertMatrix', payload);
  if (!data.ok) {
    errEl.textContent = data.error;
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('editMatrixOverlay').classList.remove('show');
  openClient(currentClientId);
};
</script>

</body>
</html>
