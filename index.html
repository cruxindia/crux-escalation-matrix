<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux Escalation Matrix</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; color: #1a1a1a; text-align: center; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .sub { color: #666; font-size: 0.9rem; margin-bottom: 32px; }
  #g_id_signin { display: inline-block; margin: 16px 0; }
  #result { text-align: left; margin-top: 24px; padding: 16px; border-radius: 10px; background: #f7f7f7; display: none; }
  #result.ok { background: #eafaf0; border: 1px solid #b6e6c9; }
  #result.err { background: #fdecec; border: 1px solid #f3b8b8; }
  .row { margin: 4px 0; font-size: 0.92rem; }
  .row b { display: inline-block; width: 70px; }
</style>
</head>
<body>

<h1>Crux Escalation Matrix</h1>
<div class="sub">Sign in with your cruxindia.co.in Google account</div>

<div id="g_id_onload"
     data-client_id="512625006659-2akqlqt7dogflaqseig316ung5ub08n6.apps.googleusercontent.com"
     data-callback="handleCredentialResponse"
     data-hd="cruxindia.co.in">
</div>
<div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large" data-text="signin_with"></div>

<div id="result"></div>

<script>
// Update this after each deployment/redeploy of the Apps Script.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxUiAVMRxRbPCYKT2QXpeOCnLnngIRA_t5qF50ct8Un/dev';

async function handleCredentialResponse(response) {
  const out = document.getElementById('result');
  out.style.display = 'block';
  out.className = '';
  out.innerHTML = 'Verifying with server...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'whoami', token: response.credential })
    });
    const data = await res.json();

    if (data.ok) {
      out.className = 'ok';
      out.innerHTML =
        '<div class="row"><b>Status</b> Signed in</div>' +
        '<div class="row"><b>Name</b> ' + data.user.name + '</div>' +
        '<div class="row"><b>Email</b> ' + data.user.email + '</div>' +
        '<div class="row"><b>Role</b> ' + data.user.role + '</div>';
    } else {
      out.className = 'err';
      out.innerHTML = '<div class="row"><b>Status</b> Rejected</div><div class="row"><b>Reason</b> ' + data.error + '</div>';
    }
  } catch (err) {
    out.className = 'err';
    out.innerHTML = '<div class="row"><b>Status</b> Network error</div><div class="row"><b>Detail</b> ' + err.message + '</div>';
  }
}
</script>

</body>
</html>
